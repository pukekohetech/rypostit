  function speechSupported() {
    return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  function toggleVoice() {
    if (ui.recognition) {
      stopRecognition();
      return;
    }
    startVoiceRecognition();
  }

  function startVoiceRecognition() {
    if (!speechSupported()) {
      toast('Voice recognition is not available in this browser.');
      return;
    }
    const textarea = $('#quickText');
    if (!textarea) return;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    ui.recognition = recognition;
    ui.voiceBase = textarea.value.trim();
    recognition.lang = 'en-NZ';
    recognition.interimResults = true;
    recognition.continuous = false;
    $('#quickMic').classList.add('mic-live');
    $('#voiceStatus').textContent = 'Listening... Tap again to stop.';

    recognition.onresult = event => {
      let finalText = '';
      let interimText = '';
      for (let index = 0; index < event.results.length; index += 1) {
        const transcript = event.results[index][0].transcript;
        if (event.results[index].isFinal) finalText += transcript;
        else interimText += transcript;
      }
      const dictated = `${finalText}${interimText}`.trim();
      textarea.value = [ui.voiceBase, dictated].filter(Boolean).join(ui.voiceBase && dictated ? ' ' : '');
      ui.captureDirty = true;
    };
    let voiceErrorMessage = '';
    recognition.onerror = event => {
      voiceErrorMessage = event.error === 'not-allowed'
        ? 'Microphone permission was not granted. You can keep typing, or change the browser microphone permission.'
        : `Voice recognition stopped: ${event.error}.`;
      $('#voiceStatus').textContent = voiceErrorMessage;
      toast(voiceErrorMessage, 3800);
    };
    recognition.onend = () => {
      $('#quickMic')?.classList.remove('mic-live');
      if ($('#voiceStatus')) $('#voiceStatus').textContent = voiceErrorMessage || (textarea.value.trim() ? 'Dictation added. Tap the microphone to add more.' : 'Tap the microphone to dictate.');
      ui.recognition = null;
      ui.voiceBase = textarea.value.trim();
    };
    try {
      recognition.start();
    } catch (error) {
      console.warn('Could not start speech recognition:', error?.name || 'unknown error');
      ui.recognition = null;
      $('#quickMic').classList.remove('mic-live');
      $('#voiceStatus').textContent = 'The microphone could not start. Typing still works.';
    }
  }

  function stopRecognition() {
    if (ui.recognition) {
      const recognition = ui.recognition;
      ui.recognition = null;
      try { recognition.abort(); } catch (error) { console.warn('Speech recognition could not stop cleanly:', error?.name || 'unknown error'); }
    }
    $$('.mic-live').forEach(element => element.classList.remove('mic-live'));
  }

  function validateImportObject(parsed) {
    const candidate = parsed && typeof parsed === 'object' && parsed.state ? parsed.state : parsed;
    if (!candidate || typeof candidate !== 'object') throw new Error('The file does not contain an app data object.');
    if (!Array.isArray(candidate.reminders) || !Array.isArray(candidate.history)) throw new Error('The file is missing reminder or history data.');
    if (candidate.reminders.length > CONFIG.maxReminders || candidate.history.length > CONFIG.maxHistory) throw new Error('The file contains more records than this version can safely load.');
    return migrateState(candidate);
  }

  function exportBackup() {
    const payload = {
      app: 'Post-it Reminder',
      formatVersion: CONFIG.version,
      exportedAt: now().toISOString(),
      state
    };
    downloadFile(`postit-reminder-backup-${localDate(now())}.json`, JSON.stringify(payload, null, 2), 'application/json');
    toast('Backup exported.');
  }

  function importBackup(file) {
    if (!file) return;
    if (file.size > CONFIG.maxImportBytes) {
      window.alert('That file is too large to import safely. Choose a Post-it Reminder JSON backup smaller than 5 MB.');
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => window.alert('The backup file could not be read.');
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const result = validateImportObject(parsed);
        const note = result.repairs.length ? `\n\n${result.repairs.length} field(s) will be repaired during import.` : '';
        if (!window.confirm(`Replace the current data with ${result.state.reminders.length} reminder(s) and ${result.state.history.length} history record(s)?${note}`)) return;
        saveRecoverySnapshot(state, 'Before importing a backup');
        state = result.state;
        persistState();
        closeDrawer();
        toast('Backup imported.');
      } catch (error) {
        console.warn('Rejected backup import:', error.message);
        window.alert(`That file could not be imported. ${error.message}`);
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  function safeCsvText(value) {
    let text = String(value ?? '');
    if (/^[\t\r ]*[=+\-@]/.test(text)) text = `'${text}`;
    return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }

  function exportYearCsv() {
    const year = Number($('#historyYear')?.value || state.settings.historyYear || now().getFullYear());
    const summary = summariseYear(year);
    const rows = [
      ['Post-it Reminder Year Report', year],
      ['Generated', fmt(now())],
      ['Completed occurrences', summary.rows.length],
      ['Actual minutes', summary.totalMinutes],
      ['Actual hours', (summary.totalMinutes / 60).toFixed(2)],
      ['Planned minutes', summary.plannedMinutes],
      ['Variance minutes', summary.totalMinutes - summary.plannedMinutes],
      ['Total snoozes', summary.snoozes],
      [],
      ['CATEGORY SUMMARY'],
      ['Category','Completions','Actual minutes','Actual hours','Planned minutes','Variance minutes']
    ];
    [...summary.byCategory.entries()].sort((a,b) => b[1].actual - a[1].actual).forEach(([category, value]) => rows.push([category, value.count, value.actual, (value.actual / 60).toFixed(2), value.planned, value.actual - value.planned]));
    rows.push([], ['MONTHLY SUMMARY'], ['Month','Actual minutes','Actual hours']);
    [...summary.byMonth.entries()].forEach(([month, minutes]) => rows.push([month, minutes, (minutes / 60).toFixed(2)]));
    rows.push([], ['COMPLETION DETAIL'], ['Completed','Title','Reminder','Category','Actual minutes','Planned minutes','Variance','Repeat','Scheduled for','Completed early','Snoozes','Completion note','Timer started']);
    summary.rows.forEach(item => rows.push([
      fmt(item.completedAt), item.title, item.text, item.category || 'Uncategorised', item.actualMinutes, item.plannedMinutes,
      item.actualMinutes - item.plannedMinutes, repeatLabel(item.repeat), fmt(item.scheduledFor), item.completedEarly ? 'Yes' : 'No', item.snoozeCount,
      item.completionNote, item.timerStartedAt ? fmt(item.timerStartedAt) : ''
    ]));
    const csv = '\ufeff' + rows.map(row => row.map(safeCsvText).join(',')).join('\r\n');
    downloadFile(`postit-time-report-${year}-${localDate(now())}.csv`, csv, 'text/csv;charset=utf-8');
    toast(`${year} CSV report exported.`);
  }

  function downloadFile(name, content, type) {
    try {
      const blob = new Blob([content], {type});
      const anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(blob);
      anchor.download = name.replace(/[\\/:*?"<>|]/g, '-');
      document.body.appendChild(anchor);
      anchor.click();
      window.setTimeout(() => {
        URL.revokeObjectURL(anchor.href);
        anchor.remove();
      }, 1000);
    } catch (error) {
      console.error('Download failed:', error);
      toast('The file could not be downloaded in this browser.');
    }
  }

  function openDialog(dialog, opener = document.activeElement) {
    if (!dialog || dialog.open) return;
    ui.dialogOpener = opener;
    try {
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    } catch (error) {
      console.warn('Dialog could not open normally:', error?.name || 'unknown error');
      dialog.setAttribute('open', '');
    }
  }

  function closeDialog(dialog, force = false) {
    if (dialog.id === 'editDialog' && !force && ui.editInitial && editFormSignature() !== ui.editInitial) {
      if (!window.confirm('Discard unsaved changes?')) return false;
    }
    if (typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
    return true;
  }

    updateStorageBanner();
    renderPostit();
    updateCategorySuggestions();

    placeNote();

  function noteBounds() {
    const wrap = $('#floatWrap');
    return {width: wrap.offsetWidth, height: wrap.offsetHeight};
  }

  function clampPosition(left, top) {
    const bounds = noteBounds();
    const small = window.innerWidth <= 680;
    const minTop = small ? 62 : 12;
    const maxLeft = Math.max(8, window.innerWidth - bounds.width - 8);
    const maxTop = Math.max(minTop, window.innerHeight - bounds.height - 8);
    return {left: clamp(left, 8, maxLeft), top: clamp(top, minTop, maxTop)};
  }

  function defaultPosition() {
    const bounds = noteBounds();
    const small = window.innerWidth <= 680;
    return clampPosition((window.innerWidth - bounds.width) / 2, small ? 62 : (window.innerHeight - bounds.height) / 2);
  }

  function placeNote() {
    const wrap = $('#floatWrap');
    const requested = state.settings.notePosition;
    const position = requested ? clampPosition(Number(requested.left), Number(requested.top)) : defaultPosition();
    wrap.style.left = `${Math.round(position.left)}px`;
    wrap.style.top = `${Math.round(position.top)}px`;
    if (requested && (position.left !== requested.left || position.top !== requested.top)) {
      state.settings.notePosition = position;
      persistState({render:false});
    }
    updateToolSide(position.left, wrap.offsetWidth);
  }

  function updateToolSide(left, width) {
    const wrap = $('#floatWrap');
    if (window.innerWidth <= 680) {
      wrap.classList.remove('tools-right');
      return;
    }
    const leftSpace = left;
    const rightSpace = window.innerWidth - (left + width);
    wrap.classList.toggle('tools-right', leftSpace < 82 && rightSpace > leftSpace);
  }

  function centreNote() {
    state.settings.notePosition = null;
    persistState({render:false});
    placeNote();
    toast('Post-it centred.');
  }

  function beginDrag(event) {
    if (event.button !== undefined && event.button !== 0) return;
    const wrap = $('#floatWrap');
    const rect = wrap.getBoundingClientRect();
    ui.dragging = {pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, left: rect.left, top: rect.top};
    wrap.classList.add('dragging');
    $('#dragHandle').setPointerCapture?.(event.pointerId);
    event.preventDefault();
  }

  function moveDrag(event) {
    if (!ui.dragging || event.pointerId !== ui.dragging.pointerId) return;
    const next = clampPosition(ui.dragging.left + event.clientX - ui.dragging.startX, ui.dragging.top + event.clientY - ui.dragging.startY);
    const wrap = $('#floatWrap');
    wrap.style.left = `${Math.round(next.left)}px`;
    wrap.style.top = `${Math.round(next.top)}px`;
    updateToolSide(next.left, wrap.offsetWidth);
  }

  function endDrag(event) {
    if (!ui.dragging || event.pointerId !== ui.dragging.pointerId) return;
    const wrap = $('#floatWrap');
    const rect = wrap.getBoundingClientRect();
    state.settings.notePosition = clampPosition(rect.left, rect.top);
    ui.dragging = null;
    wrap.classList.remove('dragging');
    persistState({render:false});
    announce('Post-it position saved.');
  }

  function moveNoteWithKeyboard(event) {
    if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(event.key)) return;
    event.preventDefault();
    if (event.key === 'Home') {
      centreNote();
      return;
    }
    const rect = $('#floatWrap').getBoundingClientRect();
    const step = event.shiftKey ? 24 : 6;
    const dx = event.key === 'ArrowLeft' ? -step : event.key === 'ArrowRight' ? step : 0;
    const dy = event.key === 'ArrowUp' ? -step : event.key === 'ArrowDown' ? step : 0;
    state.settings.notePosition = clampPosition(rect.left + dx, rect.top + dy);
    persistState({render:false});
    placeNote();
  }

  function trapDrawerFocus(event) {
    if (event.key !== 'Tab' || !$('#drawer').classList.contains('open')) return;
    const focusable = $$(`#drawer button:not([disabled]), #drawer input:not([disabled]), #drawer select:not([disabled]), #drawer textarea:not([disabled]), #drawer [href], #drawer [tabindex]:not([tabindex="-1"])`)
      .filter(element => element.offsetParent !== null);
    if (!focusable.length) {
      event.preventDefault();
      $('#drawerClose').focus();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function setToolRailOpen(open, {pinned = false, returnFocus = false} = {}) {
    const wrap = $('#floatWrap');
    const tab = $('#edgeTab');
    const rail = $('#toolRail');
    ui.railPinned = Boolean(open && pinned);
    wrap.classList.toggle('rail-open', Boolean(open));
    tab.setAttribute('aria-expanded', String(Boolean(open)));
    tab.setAttribute('aria-label', open ? 'Close tools' : 'Open tools');
    rail.setAttribute('aria-hidden', String(!open));
    $$('#toolRail button').forEach(button => { button.tabIndex = open ? 0 : -1; });
    if (!open && returnFocus && document.activeElement && rail.contains(document.activeElement)) {
      ui.suppressRailFocusOpen = true;
      tab.focus();
      ui.suppressRailFocusOpen = false;
    }
  }

  function handleGlobalKeyboard(event) {
    const activeElement = document.activeElement;
    const activeTag = activeElement?.tagName;
    const interactive = ['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(activeTag) || activeElement?.isContentEditable;
    if (event.key === 'Escape') {
      if ($$('dialog[open]').length) return;
      if ($('#drawer').classList.contains('open')) {
        event.preventDefault();
        closeDrawer();
      } else if (ui.mode === 'create') {
        event.preventDefault();
        cancelCapture();
      } else if ($('#floatWrap').classList.contains('rail-open')) {
        event.preventDefault();
        setToolRailOpen(false, {returnFocus:true});
      }
      return;
    }
    if (event.ctrlKey || event.metaKey || event.altKey || event.repeat || interactive || $$('dialog[open]').length || $('#drawer').classList.contains('open')) return;
    if (event.key.toLowerCase() === 'n') {
      event.preventDefault();
      startCapture();
    } else if (event.key.toLowerCase() === 'm') {
      event.preventDefault();
      startCapture({voiceReady:true});
    } else if (event.key.toLowerCase() === 'd' && ui.currentReminderId && dueList().some(item => item.id === ui.currentReminderId)) {
      event.preventDefault();
      openSnooze(ui.currentReminderId, document.activeElement);
    } else if (event.key === 'Enter' && ui.currentReminderId && dueList().some(item => item.id === ui.currentReminderId)) {
      event.preventDefault();
      openDone(ui.currentReminderId, document.activeElement);
    }
  }

  function bindStaticEvents() {
    $('#edgeTab').addEventListener('pointerenter', () => {
      if (!$('#floatWrap').classList.contains('rail-open')) setToolRailOpen(true);
    });
    $('#edgeTab').addEventListener('focus', () => { if (!ui.suppressRailFocusOpen) setToolRailOpen(true); });
    $('#edgeTab').addEventListener('click', () => {
      const currentlyOpen = $('#floatWrap').classList.contains('rail-open');
      if (currentlyOpen && ui.railPinned) setToolRailOpen(false, {returnFocus:true});
      else setToolRailOpen(true, {pinned:true});
    });
    $('#floatWrap').addEventListener('pointerleave', () => {
      if (!ui.railPinned && !$('#floatWrap').contains(document.activeElement)) setToolRailOpen(false);
    });
    $('#floatWrap').addEventListener('focusout', () => window.setTimeout(() => {
      if (!$('#floatWrap').contains(document.activeElement)) setToolRailOpen(false);
    }, 0));
    $('#newBtn').addEventListener('click', () => {
      setToolRailOpen(false);
      startCapture();
    });
    $('#voiceBtn').addEventListener('click', () => {
      setToolRailOpen(false);
      startCapture({voiceReady:true});
    });
    const openToolDrawer = (type, button) => {
      setToolRailOpen(false);
      openDrawer(type, button);
    };
    $('#listBtn').addEventListener('click', event => openToolDrawer('notes', event.currentTarget));
    $('#historyBtn').addEventListener('click', event => openToolDrawer('history', event.currentTarget));
    $('#settingsBtn').addEventListener('click', event => openToolDrawer('settings', event.currentTarget));
    $('#drawerClose').addEventListener('click', () => closeDrawer());
    $('#drawerShade').addEventListener('click', () => closeDrawer());
    $('#saveEditBtn').addEventListener('click', saveEdit);
    $('#deleteEditBtn').addEventListener('click', deleteCurrentEdit);
    $('#completeBtn').addEventListener('click', completeReminder);
    $('#customSnoozeBtn').addEventListener('click', applyCustomSnooze);
    $('#importFile').addEventListener('change', event => {
      importBackup(event.target.files[0]);
      event.target.value = '';
    });
    $('#undoBtn').addEventListener('click', undoLastAction);
    $('#undoClose').addEventListener('click', hideUndo);
    $('#storageBannerClose').addEventListener('click', () => {
      ui.bannerDismissed = true;
      updateStorageBanner();
    });
    $$('[data-close]').forEach(button => button.addEventListener('click', () => closeDialog($(`#${button.dataset.close}`))));
    $$('[data-snooze]').forEach(button => button.addEventListener('click', () => applySnooze(button.dataset.snooze)));
    $$('#timeGrid [data-minutes]').forEach(button => button.addEventListener('click', () => selectDoneMinutes(button.dataset.minutes)));
    ['editDate','editTime','editRepeat'].forEach(id => $(`#${id}`).addEventListener('input', updateEditSchedulePreview));
    $('#dragHandle').addEventListener('pointerdown', beginDrag);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    $('#dragHandle').addEventListener('keydown', moveNoteWithKeyboard);
    window.addEventListener('resize', placeNote);
    document.addEventListener('keydown', handleGlobalKeyboard);
    $('#drawer').addEventListener('keydown', trapDrawerFocus);
    document.addEventListener('pointerdown', event => {
      if (!$('#floatWrap').contains(event.target)) setToolRailOpen(false);
    });
    $('#editDialog').addEventListener('cancel', event => {
      if (ui.editInitial && editFormSignature() !== ui.editInitial && !window.confirm('Discard unsaved changes?')) event.preventDefault();
    });
    $$('dialog').forEach(dialog => dialog.addEventListener('close', () => {
      const returnTarget = ui.dialogOpener;
      ui.dialogOpener = null;
      if (returnTarget?.isConnected) returnTarget.focus();
      else if ($('#drawer').classList.contains('open')) $('#drawerClose').focus();
      else $('#edgeTab').focus();
    }));
    window.addEventListener('beforeprint', () => $('#printArea').setAttribute('aria-hidden', 'false'));
    window.addEventListener('afterprint', () => $('#printArea').setAttribute('aria-hidden', 'true'));
    window.addEventListener('error', event => {
      console.error('Unexpected Post-it Reminder error:', event.error || event.message);
      toast('Something unexpected happened. Your saved data has been left intact.', 4000);
    });
    window.addEventListener('unhandledrejection', event => {
      console.error('Unhandled Post-it Reminder promise error:', event.reason);
      toast('An unexpected browser operation failed. Your saved data has been left intact.', 4000);
    });
  }

  bindStaticEvents();
  setToolRailOpen(false);
  if (!storageInfo.loadFailed) persistState({render:false});
  renderAll();
  setInterval(() => {
    if (ui.mode === 'current' && !$$('dialog[open]').length) renderPostit();
  }, 30000);
})();
</script>

<script>
(() => {
  'use strict';
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', {scope: './'})
      .catch(error => console.warn('Post-it Reminder service worker could not be registered:', error));
  });
})();
</script>
</body>
