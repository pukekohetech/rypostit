<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff18a">
<meta name="color-scheme" content="light">
<meta name="description" content="A simple floating Post-it reminder and time-tracking app.">
<meta name="application-name" content="Post-it Reminder">
<title>Post-it Reminder</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root {
  --desk: #e7e4dc;
  --desk-dark: #d7d1c4;
  --ink: #26251f;
  --muted: #6e695d;
  --paper: #fffdf8;
  --yellow: #fff18a;
  --accent: #235247;
  --accent-hover: #173f36;
  --danger: #9b3d36;
  --danger-soft: #f9e8e5;
  --line: rgba(55, 50, 39, 0.18);
  --shadow: 0 28px 80px rgba(46, 41, 29, 0.24), 0 8px 20px rgba(46, 41, 29, 0.10);
  --soft-shadow: 0 14px 36px rgba(46, 41, 29, 0.14);
  --radius: 14px;
  --focus: 0 0 0 4px rgba(35, 82, 71, 0.24);
  font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body {
  min-height: 100dvh;
  overflow: hidden;
  color: var(--ink);
  background:
    radial-gradient(circle at 50% 25%, rgba(255,255,255,0.88), rgba(255,255,255,0.20) 44%, transparent 72%),
    repeating-linear-gradient(90deg, transparent 0 79px, rgba(69,60,42,0.026) 80px),
    var(--desk);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: none;
  box-shadow: var(--focus);
}
.hidden { display: none !important; }
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0,0,0,0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}
.muted { color: var(--muted); }
.small { font-size: 0.79rem; }
.tiny { font-size: 0.72rem; }
.strong { font-weight: 750; }

.storage-banner {
  position: fixed;
  top: max(10px, env(safe-area-inset-top));
  left: 50%;
  z-index: 90;
  width: min(92vw, 760px);
  transform: translateX(-50%);
  padding: 10px 42px 10px 14px;
  border: 1px solid #cfaba5;
  border-radius: 11px;
  background: #fff4f1;
  color: #702e28;
  box-shadow: var(--soft-shadow);
  font-size: 0.82rem;
  line-height: 1.35;
}
.storage-banner button {
  position: absolute;
  right: 7px;
  top: 6px;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font-size: 1.2rem;
}

.stage {
  position: relative;
  width: 100vw;
  height: 100dvh;
  min-height: 360px;
  overflow: hidden;
}
.float-wrap {
  position: fixed;
  width: min(480px, calc(100vw - 32px));
  height: min(500px, calc(100dvh - 32px));
  min-width: min(320px, calc(100vw - 32px));
  min-height: min(390px, calc(100dvh - 32px));
  isolation: isolate;
  touch-action: none;
  transition: filter 0.18s ease;
}
.float-wrap.capture-mode { height: min(560px, calc(100dvh - 32px)); }
.float-wrap.dragging { filter: drop-shadow(0 12px 14px rgba(43,38,27,0.16)); }
.back-note {
  position: absolute;
  inset: 10px -10px -9px 12px;
  z-index: 0;
  background: #f2d98e;
  transform: rotate(2deg);
  box-shadow: var(--soft-shadow);
}
.back-note.two {
  inset: 5px -3px -4px 7px;
  background: #f8e5a4;
  transform: rotate(-0.9deg);
}
.postit {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: auto;
  scrollbar-width: thin;
  padding: 28px 30px 24px;
  background: var(--yellow);
  box-shadow: var(--shadow);
  transform: rotate(-0.18deg);
  transition: background-color 0.2s ease, transform 0.18s ease, opacity 0.18s ease;
}
.postit::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.42), transparent 34%, rgba(66,54,24,0.046)),
    repeating-linear-gradient(0deg, transparent 0 32px, rgba(72,61,34,0.018) 33px);
}
.postit > * { position: relative; z-index: 1; }
.postit.animate-out { animation: note-out 0.2s ease forwards; }
@keyframes note-out {
  to { transform: translate(34px,-18px) rotate(4.5deg); opacity: 0; }
}

.drag-handle {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 7px;
  width: 52px;
  height: 20px;
  transform: translateX(-50%);
  border: 0;
  border-radius: 999px;
  background: transparent;
  cursor: grab;
  touch-action: none;
}
.drag-handle:active { cursor: grabbing; }
.drag-handle::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 8px;
  width: 24px;
  height: 4px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: rgba(58,51,34,0.23);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.16);
}

.edge-tab {
  position: absolute;
  left: -26px;
  top: 58px;
  z-index: 5;
  display: grid;
  place-items: center;
  width: 34px;
  height: 78px;
  border: 0;
  border-radius: 11px 0 0 11px;
  background: #484740;
  color: #fff;
  box-shadow: -5px 7px 16px rgba(0,0,0,0.15);
  transition: left 0.18s ease, right 0.18s ease, background 0.15s ease;
}
.edge-tab:hover { background: #2f302c; }
.edge-tab span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 0.64rem;
  font-weight: 800;
  letter-spacing: 0.12em;
}
.tool-rail {
  position: absolute;
  left: -87px;
  top: 43px;
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 9px;
  border: 1px solid rgba(68,61,46,0.14);
  border-radius: 14px;
  background: rgba(255,253,247,0.98);
  box-shadow: var(--soft-shadow);
  opacity: 0;
  pointer-events: none;
  transform: translateX(60px);
  transition: transform 0.18s ease, opacity 0.18s ease;
}
.float-wrap.rail-open .tool-rail {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}
.float-wrap.tools-right .edge-tab {
  left: auto;
  right: -26px;
  border-radius: 0 11px 11px 0;
}
.float-wrap.tools-right .tool-rail {
  left: auto;
  right: -87px;
  transform: translateX(-60px);
}
.float-wrap.tools-right.rail-open .tool-rail { transform: translateX(0); }
.rail-btn, .round-btn, .icon-btn {
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(61,55,42,0.12);
  border-radius: 11px;
  background: rgba(255,255,255,0.78);
  box-shadow: 0 1px 0 rgba(255,255,255,0.68) inset;
  transition: transform 0.14s ease, background 0.14s ease;
}
.rail-btn:hover, .round-btn:hover, .icon-btn:hover { transform: translateY(-1px); background: #fff; }
.rail-btn svg, .round-btn svg, .icon-btn svg { width: 21px; height: 21px; stroke: currentColor; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  z-index: 100;
  width: max-content;
  max-width: 210px;
  transform: translateY(-50%) translateX(-4px);
  padding: 6px 8px;
  border-radius: 7px;
  background: #24241f;
  color: #fff;
  font-size: 0.72rem;
  line-height: 1.2;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease, transform 0.12s ease;
}
[data-tooltip]:hover::after, [data-tooltip]:focus-visible::after {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}
.tools-right [data-tooltip]::after { left: auto; right: calc(100% + 10px); }
.mic-live {
  color: var(--danger);
  background: #fff3f1 !important;
  animation: mic-pulse 1.25s ease-in-out infinite;
}
@keyframes mic-pulse { 50% { box-shadow: 0 0 0 7px rgba(155,61,54,0.10); } }

.note-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 36px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 78%;
  padding: 6px 10px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255,255,255,0.52);
  font-size: 0.72rem;
  font-weight: 780;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip.overdue { color: #7f302a; background: rgba(155,61,54,0.13); }
.chip.early { color: #274e62; background: rgba(65,123,153,0.14); }
.more-btn {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.37);
  font-size: 1.24rem;
  font-weight: 800;
  letter-spacing: 0.06em;
}
.note-kicker {
  margin-top: 18px;
  color: rgba(54,49,36,0.68);
  font-size: 0.72rem;
  font-weight: 820;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.note-title {
  margin: 13px 0 7px;
  font-size: clamp(1.7rem, 5.2vw, 2.05rem);
  line-height: 1.07;
  letter-spacing: -0.025em;
  overflow-wrap: anywhere;
}
.note-copy {
  flex: 1;
  min-height: 0;
  padding: 5px 2px 9px;
  overflow: auto;
  scrollbar-width: thin;
  font-family: "Segoe Print", "Comic Sans MS", cursive;
  font-size: clamp(1.28rem, 4.4vw, 1.62rem);
  line-height: 1.36;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.note-copy.primary-copy {
  margin-top: 13px;
  font-size: clamp(1.55rem, 5vw, 1.95rem);
}
.note-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  margin: 4px 0 12px;
  color: #514c3e;
  font-size: 0.75rem;
  line-height: 1.3;
}
.meta-pill {
  padding: 3px 7px;
  border-radius: 999px;
  background: rgba(255,255,255,0.30);
}
.micro-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 35px;
  margin-bottom: 8px;
}
.timer-btn {
  min-height: 34px;
  padding: 5px 2px;
  border: 0;
  background: transparent;
  color: #4d493d;
  font-size: 0.78rem;
  font-weight: 740;
  text-align: left;
}
.timer-btn.active { color: #7c332e; }
.behind {
  flex: 0 0 auto;
  padding: 5px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.38);
  color: #5c5647;
  font-size: 0.71rem;
  font-weight: 730;
}
.note-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.action {
  min-height: 50px;
  border: 1px solid rgba(48,43,32,0.21);
  border-radius: 11px;
  background: rgba(255,255,255,0.62);
  font-weight: 820;
  letter-spacing: 0.025em;
  transition: transform 0.12s ease, background 0.12s ease;
}
.action:hover { transform: translateY(-1px); background: rgba(255,255,255,0.84); }
.action.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
.action.primary:hover { background: var(--accent-hover); }
.action.ghost { background: rgba(255,255,255,0.40); }

.empty-state {
  display: grid;
  place-items: center;
  flex: 1;
  padding: 20px;
  text-align: center;
}
.empty-mark {
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: rgba(255,255,255,0.38);
  color: var(--accent);
}
.empty-mark svg { width: 34px; height: 34px; }
.empty-state h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 7vw, 2.2rem); }
.empty-state p { max-width: 320px; margin: 0 auto; color: #5d5748; line-height: 1.5; }
.empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 22px; }
.empty-actions button {
  min-height: 44px;
  padding: 9px 14px;
  border: 1px solid rgba(55,50,38,0.19);
  border-radius: 10px;
  background: rgba(255,255,255,0.58);
  font-weight: 760;
}

.capture-title { margin: 13px 0 9px; font-size: 1.45rem; }
.capture-area {
  width: 100%;
  flex: 1;
  min-height: 105px;
  padding: 11px 12px;
  border: 1px solid rgba(60,54,42,0.12);
  border-radius: 10px;
  resize: none;
  background: rgba(255,255,255,0.22);
  font-family: "Segoe Print", "Comic Sans MS", cursive;
  font-size: clamp(1.14rem, 4vw, 1.45rem);
  line-height: 1.35;
}
.capture-area::placeholder { color: rgba(51,46,34,0.46); }
.capture-voice { display: flex; align-items: center; gap: 9px; margin: 8px 0 10px; }
.voice-text { min-height: 18px; color: #5a5548; font-size: 0.76rem; line-height: 1.3; }
.schedule-label { margin: 0 0 6px; font-size: 0.76rem; font-weight: 780; }
.preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.preset-btn {
  min-height: 38px;
  padding: 7px 5px;
  border: 1px solid rgba(60,54,42,0.17);
  border-radius: 9px;
  background: rgba(255,255,255,0.50);
  font-size: 0.72rem;
  font-weight: 730;
}
.preset-btn.selected { border-color: var(--accent); background: rgba(35,82,71,0.12); color: #173f36; }
.schedule-row { display: grid; grid-template-columns: 1.1fr 0.72fr 0.9fr; gap: 7px; margin-top: 7px; }
.schedule-row input, .schedule-row select,
.mini-field input, .mini-field select,
.field input, .field select, .field textarea,
.drawer-toolbar input, .drawer-toolbar select {
  width: 100%;
  min-height: 40px;
  border: 1px solid rgba(60,54,42,0.19);
  border-radius: 9px;
  background: rgba(255,255,255,0.72);
  padding: 8px 9px;
}
.schedule-preview {
  min-height: 33px;
  margin-top: 7px;
  padding: 7px 9px;
  border-radius: 9px;
  background: rgba(255,255,255,0.34);
  color: #514c3f;
  font-size: 0.72rem;
  line-height: 1.35;
}
.capture-details { margin: 7px 0 8px; }
.capture-details summary { cursor: pointer; color: #555043; font-size: 0.76rem; font-weight: 760; }
.details-grid { display: grid; grid-template-columns: 1fr 0.75fr 0.8fr; gap: 7px; margin-top: 8px; }
.capture-buttons { display: grid; grid-template-columns: 0.72fr 1.28fr; gap: 9px; margin-top: auto; }
.capture-buttons button { min-height: 45px; border-radius: 10px; font-weight: 790; }
.capture-buttons .cancel { border: 1px solid rgba(58,53,41,0.18); background: rgba(255,255,255,0.50); }
.capture-buttons .save { border: 1px solid var(--accent); background: var(--accent); color: #fff; }

.drawer-shade {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(38,35,29,0.23);
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.drawer-shade.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  right: 0;
  top: 0;
  z-index: 31;
  display: flex;
  flex-direction: column;
  width: min(94vw, 650px);
  height: 100dvh;
  background: var(--paper);
  box-shadow: -24px 0 60px rgba(40,35,26,0.20);
  transform: translateX(102%);
  transition: transform 0.24s ease;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: max(18px, env(safe-area-inset-top)) 20px 16px;
  border-bottom: 1px solid #e2ddd2;
}
.drawer-head h2 { margin: 0; font-size: 1.35rem; }
.drawer-close {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  font-size: 1.55rem;
}
.drawer-body { flex: 1; overflow: auto; padding: 18px 20px 32px; }
.drawer-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.drawer-toolbar input { flex: 1 1 220px; }
.primary-btn, .secondary-btn, .danger-btn, .quiet-btn {
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 9px;
  font-weight: 730;
}
.primary-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
.secondary-btn { border: 1px solid #d5cec1; background: #fff; }
.danger-btn { border: 1px solid var(--danger); background: var(--danger); color: #fff; }
.quiet-btn { border: 1px solid transparent; background: transparent; color: #4f4a40; }
.panel {
  margin-bottom: 13px;
  padding: 15px;
  border: 1px solid #e0d9cc;
  border-radius: 14px;
  background: #fff;
}
.panel h3 { margin: 0 0 7px; font-size: 1rem; }
.panel p { margin: 6px 0; line-height: 1.45; }
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.card {
  display: grid;
  grid-template-columns: 8px minmax(0,1fr) auto;
  gap: 12px;
  margin-bottom: 9px;
  overflow: hidden;
  border: 1px solid #e2dbce;
  border-radius: 13px;
  background: #fff;
}
.swatch { min-height: 100%; }
.card-main { min-width: 0; padding: 12px 0; }
.card-main h3 { margin: 0 0 4px; font-size: 0.96rem; overflow-wrap: anywhere; }
.card-main p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.82rem; line-height: 1.38; }
.card-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; color: #777166; font-size: 0.7rem; }
.card-actions { display: flex; align-items: center; gap: 5px; padding: 10px 10px 10px 0; }
.card-actions button { min-height: 34px; padding: 6px 8px; border: 1px solid #ddd6ca; border-radius: 8px; background: #fff; font-size: 0.71rem; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { padding: 12px; border: 1px solid #e2dbcf; border-radius: 12px; background: #fff; }
.stat strong { display: block; font-size: 1.5rem; }
.stat span { color: #777166; font-size: 0.71rem; }
.breakdown-row { display: grid; grid-template-columns: minmax(80px,1fr) 2fr auto; align-items: center; gap: 9px; margin: 8px 0; font-size: 0.78rem; }
.breakdown-track { height: 8px; overflow: hidden; border-radius: 999px; background: #eee9df; }
.breakdown-fill { height: 100%; border-radius: inherit; background: var(--accent); }
.table-wrap { max-height: 50vh; overflow: auto; border: 1px solid #e2dbcf; border-radius: 11px; }
.history-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.75rem; }
.history-table th, .history-table td { padding: 8px; border-bottom: 1px solid #e7e1d6; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.history-table th { position: sticky; top: 0; z-index: 1; background: #f5f2eb; }
.setting-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #ece6dc; }
.setting-row:last-child { border-bottom: 0; }
.setting-row strong { display: block; font-size: 0.82rem; }
.setting-row span { color: #777166; font-size: 0.72rem; line-height: 1.35; }
.snapshot-list { display: grid; gap: 7px; margin-top: 9px; }
.snapshot-item { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 9px; padding: 9px; border: 1px solid #e6dfd3; border-radius: 10px; background: #fbfaf7; }
.snapshot-item strong { display: block; font-size: 0.77rem; }
.snapshot-item span { color: #777166; font-size: 0.68rem; }

.dialog {
  width: min(92vw, 570px);
  max-height: 90dvh;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: 16px;
  background: var(--paper);
  box-shadow: 0 30px 90px rgba(0,0,0,0.30);
}
.dialog::backdrop { background: rgba(40,37,31,0.38); backdrop-filter: blur(2px); }
.dialog[open]:not(:modal) { position: fixed; inset: 50% auto auto 50%; transform: translate(-50%,-50%); z-index: 70; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid #e4ded3; }
.dialog-head h2 { margin: 0; font-size: 1.16rem; }
.dialog-close { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 9px; background: transparent; font-size: 1.45rem; }
.dialog-body { display: grid; gap: 12px; max-height: 66dvh; overflow: auto; padding: 17px; }
.dialog-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 13px 17px; border-top: 1px solid #e4ded3; }
.field { display: grid; gap: 5px; }
.field label { font-size: 0.76rem; font-weight: 750; }
.field textarea { min-height: 100px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 0.72fr 0.8fr; gap: 9px; }
.snooze-grid, .time-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.snooze-grid button, .time-grid button {
  min-height: 44px;
  padding: 9px 7px;
  border: 1px solid #dcd5c8;
  border-radius: 9px;
  background: #fff;
  font-weight: 730;
}
.time-grid button.selected { border-color: var(--accent); background: rgba(35,82,71,0.10); color: #173f36; }
.hint { padding: 9px 10px; border-radius: 9px; background: #f2eee5; color: #645e51; font-size: 0.75rem; line-height: 1.42; }
.error-text { min-height: 18px; color: var(--danger); font-size: 0.75rem; }

.toast {
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 100;
  max-width: min(90vw, 560px);
  transform: translate(-50%, 14px);
  padding: 10px 14px;
  border-radius: 10px;
  background: #24241f;
  color: #fff;
  box-shadow: 0 12px 32px rgba(0,0,0,0.22);
  opacity: 0;
  pointer-events: none;
  font-size: 0.8rem;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%,0); }
.undo-bar {
  position: fixed;
  left: 50%;
  bottom: max(22px, env(safe-area-inset-bottom));
  z-index: 105;
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(92vw, 560px);
  transform: translate(-50%, 20px);
  padding: 11px 12px 11px 15px;
  border-radius: 12px;
  background: #24241f;
  color: #fff;
  box-shadow: 0 16px 40px rgba(0,0,0,0.26);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.undo-bar.show { opacity: 1; pointer-events: auto; transform: translate(-50%,0); }
.undo-bar span { flex: 1; min-width: 0; font-size: 0.8rem; line-height: 1.3; }
.undo-bar button { min-height: 38px; padding: 7px 11px; border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; background: transparent; color: #fff; font-weight: 800; }
.undo-close { width: 36px; padding: 0 !important; font-size: 1.15rem; }

#printArea { display: none; }
@media print {
  @page { size: A4 portrait; margin: 15mm; }
  body { overflow: visible !important; background: #fff !important; color: #111 !important; }
  body > :not(#printArea) { display: none !important; }
  #printArea { display: block !important; font-family: "Segoe UI", Arial, sans-serif; }
  .print-title { margin: 0 0 4mm; font-size: 22pt; }
  .print-sub { margin: 0 0 6mm; color: #555; font-size: 9pt; }
  .print-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 3mm; margin-bottom: 6mm; }
  .print-stat { padding: 3mm; border: 1px solid #aaa; border-radius: 2mm; break-inside: avoid; }
  .print-stat strong { display: block; font-size: 16pt; }
  .print-stat span { font-size: 8pt; color: #555; }
  .print-section { break-inside: avoid; margin: 5mm 0; }
  .print-section h2 { margin: 0 0 2mm; font-size: 13pt; }
  .print-table { width: 100%; border-collapse: collapse; font-size: 8pt; }
  .print-table th, .print-table td { padding: 2mm; border: 1px solid #bbb; text-align: left; vertical-align: top; }
  .print-table th { background: #efefef; }
  .print-page-break { break-before: page; }
}

@media (max-width: 680px) {
  .float-wrap {
    width: calc(100vw - 20px);
    height: calc(100dvh - 62px);
    min-width: 0;
    min-height: min(350px, calc(100dvh - 62px));
  }
  .float-wrap.capture-mode { height: calc(100dvh - 62px); }
  .postit { padding: 25px 20px 19px; }
  .edge-tab, .float-wrap.tools-right .edge-tab {
    left: auto;
    right: 8px;
    top: -29px;
    width: 78px;
    height: 31px;
    border-radius: 10px 10px 0 0;
  }
  .edge-tab span { writing-mode: horizontal-tb; transform: none; }
  .tool-rail, .float-wrap.tools-right .tool-rail {
    left: auto;
    right: 0;
    top: -61px;
    flex-direction: row;
    transform: translateY(34px);
  }
  .float-wrap.rail-open .tool-rail,
  .float-wrap.tools-right.rail-open .tool-rail { transform: translateY(0); }
  [data-tooltip]::after { display: none; }
  .preset-grid { grid-template-columns: 1fr 1fr; }
  .schedule-row { grid-template-columns: 1fr 0.8fr; }
  .schedule-row select { grid-column: 1 / -1; }
  .details-grid, .row, .row3 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .card { grid-template-columns: 7px minmax(0,1fr); }
  .card-actions { grid-column: 2; justify-content: flex-start; padding: 0 10px 10px 0; flex-wrap: wrap; }
  .snooze-grid, .time-grid { grid-template-columns: 1fr 1fr; }
  .drawer-body { padding-inline: 14px; }
}

@media (max-height: 560px) and (min-width: 681px) {
  .float-wrap { height: calc(100dvh - 20px); min-height: 0; }
  .postit { padding-block: 22px 17px; }
  .note-title { margin-top: 9px; }
  .note-copy { font-size: 1.25rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>
<noscript><div class="storage-banner">Post-it Reminder needs JavaScript enabled. No data has been changed.</div></noscript>
<div class="storage-banner hidden" id="storageBanner" role="alert">
  <span id="storageBannerText"></span>
  <button type="button" id="storageBannerClose" aria-label="Dismiss message">&times;</button>
</div>

<main class="stage" id="stage" aria-label="Post-it Reminder">
  <section class="float-wrap" id="floatWrap" aria-label="Floating Post-it">
    <div class="back-note" aria-hidden="true"></div>
    <div class="back-note two" aria-hidden="true"></div>
    <button type="button" class="edge-tab" id="edgeTab" aria-label="Open tools" aria-expanded="false" aria-controls="toolRail"><span>TOOLS</span></button>
    <nav class="tool-rail" id="toolRail" aria-label="Post-it tools" aria-hidden="true">
      <button type="button" class="rail-btn" id="newBtn" aria-label="New Post-it" data-tooltip="New Post-it">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="rail-btn" id="voiceBtn" aria-label="Open voice capture" data-tooltip="Voice capture">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
      </button>
      <button type="button" class="rail-btn" id="listBtn" aria-label="All Post-its" data-tooltip="All Post-its">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" class="rail-btn" id="historyBtn" aria-label="Time and history" data-tooltip="Time and history">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button type="button" class="rail-btn" id="settingsBtn" aria-label="Settings" data-tooltip="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
      </button>
    </nav>
    <article class="postit" id="postit"></article>
    <button type="button" class="drag-handle" id="dragHandle" aria-label="Move Post-it. Drag, or use arrow keys." data-tooltip="Drag to move"></button>
  </section>
</main>

<div class="drawer-shade" id="drawerShade"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawerTitle" inert>
  <div class="drawer-head">
    <h2 id="drawerTitle">Post-its</h2>
    <button type="button" class="drawer-close" id="drawerClose" aria-label="Close panel">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<dialog class="dialog" id="snoozeDialog" aria-labelledby="snoozeHeading">
  <div class="dialog-head"><h2 id="snoozeHeading">Delay this Post-it</h2><button type="button" class="dialog-close" data-close="snoozeDialog" aria-label="Close">&times;</button></div>
  <div class="dialog-body">
    <div class="snooze-grid">
      <button type="button" data-snooze="10">10 min</button>
      <button type="button" data-snooze="30">30 min</button>
      <button type="button" data-snooze="60">1 hour</button>
      <button type="button" data-snooze="180">3 hours</button>
      <button type="button" data-snooze="tomorrow">Tomorrow</button>
      <button type="button" data-snooze="nextworkday">Next workday</button>
    </div>
    <div class="field"><label for="customSnooze">Or choose a date and time</label><input type="datetime-local" id="customSnooze"></div>
    <div class="error-text" id="snoozeError" role="alert"></div>
  </div>
  <div class="dialog-foot"><button type="button" class="secondary-btn" data-close="snoozeDialog">Cancel</button><button type="button" class="primary-btn" id="customSnoozeBtn">Delay</button></div>
</dialog>

<dialog class="dialog" id="doneDialog" aria-labelledby="doneHeading">
  <div class="dialog-head"><h2 id="doneHeading">Complete Post-it</h2><button type="button" class="dialog-close" data-close="doneDialog" aria-label="Close">&times;</button></div>
  <div class="dialog-body">
    <div class="strong" id="doneName"></div>
    <div class="hint" id="doneTimeHint">Choose the closest time. You can enter an exact value below.</div>
    <div class="time-grid" id="timeGrid">
      <button type="button" data-minutes="0">No time</button>
      <button type="button" data-minutes="5">5 min</button>
      <button type="button" data-minutes="15">15 min</button>
      <button type="button" data-minutes="30">30 min</button>
      <button type="button" data-minutes="60">1 hour</button>
      <button type="button" data-minutes="other">Other</button>
    </div>
    <div class="row" id="doneDetailsRow">
      <div class="field"><label for="actualMinutes">Actual minutes</label><input id="actualMinutes" type="number" min="0" max="1440" step="1" inputmode="numeric"></div>
      <div class="field"><label for="completionNote">Optional note</label><input id="completionNote" maxlength="160" placeholder="e.g. included setup"></div>
    </div>
    <label class="inline small hidden" id="stopRepeatRow"><input type="checkbox" id="stopRepeat"> Stop this repeating Post-it after completing it</label>
    <div class="error-text" id="doneError" role="alert"></div>
  </div>
  <div class="dialog-foot"><button type="button" class="secondary-btn" data-close="doneDialog">Cancel</button><button type="button" class="primary-btn" id="completeBtn">Complete</button></div>
</dialog>

<dialog class="dialog" id="editDialog" aria-labelledby="editHeading">
  <div class="dialog-head"><h2 id="editHeading">Edit Post-it</h2><button type="button" class="dialog-close" data-close="editDialog" aria-label="Close">&times;</button></div>
  <div class="dialog-body">
    <input type="hidden" id="editId">
    <div class="field"><label for="editTitle">Optional title</label><input id="editTitle" maxlength="80"></div>
    <div class="field"><label for="editText">Post-it text</label><textarea id="editText" maxlength="800" required></textarea></div>
    <div class="row3">
      <div class="field"><label for="editCategory">Category</label><input id="editCategory" list="categorySuggestions" maxlength="40"></div>
      <div class="field"><label for="editMinutes">Planned minutes</label><input id="editMinutes" type="number" min="0" max="1440" step="1" inputmode="numeric"></div>
      <div class="field"><label for="editColor">Colour</label><select id="editColor"><option value="#fff18a">Yellow</option><option value="#ffd6a5">Peach</option><option value="#caffbf">Green</option><option value="#bde0fe">Blue</option><option value="#ffc8dd">Pink</option><option value="#e7c6ff">Purple</option></select></div>
    </div>
    <div class="row"><div class="field"><label for="editDate">Date</label><input id="editDate" type="date"></div><div class="field"><label for="editTime">Time</label><input id="editTime" type="time"></div></div>
    <div class="field"><label for="editRepeat">Repeat</label><select id="editRepeat"><option value="once">One time</option><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select></div>
    <div class="schedule-preview" id="editSchedulePreview" aria-live="polite"></div>
    <label class="inline small"><input type="checkbox" id="editPaused"> Pause this Post-it</label>
    <div class="error-text" id="editError" role="alert"></div>
  </div>
  <div class="dialog-foot"><button type="button" class="danger-btn" id="deleteEditBtn">Delete</button><span style="flex:1"></span><button type="button" class="secondary-btn" data-close="editDialog">Cancel</button><button type="button" class="primary-btn" id="saveEditBtn">Save</button></div>
</dialog>

<datalist id="categorySuggestions"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undo-bar" id="undoBar" role="status" aria-live="polite">
  <span id="undoText"></span>
  <button type="button" id="undoBtn">Undo</button>
  <button type="button" class="undo-close" id="undoClose" aria-label="Dismiss undo">&times;</button>
</div>
<div class="sr-only" id="liveStatus" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<section id="printArea" aria-hidden="true"></section>

<script>

(() => {
  'use strict';

  const CONFIG = Object.freeze({
    version: 3,
    storageKey: 'postitReminderV1',
    snapshotKey: 'postitReminderV3Snapshots',
    maxSnapshots: 6,
    undoMs: 8000,
    maxImportBytes: 5 * 1024 * 1024,
    maxReminders: 5000,
    maxHistory: 20000,
    colours: ['#fff18a', '#ffd6a5', '#caffbf', '#bde0fe', '#ffc8dd', '#e7c6ff'],
    repeats: ['once', 'daily', 'weekdays', 'weekly', 'monthly']
  });

  const ICONS = Object.freeze({
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>'
  });

  const $ = selector => document.querySelector(selector);
  const $$ = selector => Array.from(document.querySelectorAll(selector));
  const now = () => new Date();
  const deepClone = value => JSON.parse(JSON.stringify(value));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`);
  const pad = number => String(number).padStart(2, '0');
  const localDate = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  const localTime = date => `${pad(date.getHours())}:${pad(date.getMinutes())}`;
  const isoLocal = date => `${localDate(date)}T${localTime(date)}`;
  const parseLocal = (date, time) => new Date(`${date}T${time}:00`);
  const isValidDate = value => value && !Number.isNaN(new Date(value).getTime());
  const safeDate = (value, fallback = null) => isValidDate(value) ? new Date(value) : fallback;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const validColour = colour => CONFIG.colours.includes(String(colour).toLowerCase()) ? String(colour).toLowerCase() : '#fff18a';
  const cleanText = (value, max = 800) => String(value ?? '').replace(/\u0000/g, '').slice(0, max);
  const safeNumber = (value, min = 0, max = 1440) => {
    const number = Number(value);
    return Number.isFinite(number) ? clamp(Math.round(number), min, max) : min;
  };
  const esc = (value = '') => String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
  const fmt = value => new Intl.DateTimeFormat('en-NZ', {dateStyle: 'medium', timeStyle: 'short'}).format(new Date(value));
  const fmtShort = value => new Intl.DateTimeFormat('en-NZ', {weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}).format(new Date(value));
  const fmtDateOnly = value => new Intl.DateTimeFormat('en-NZ', {dateStyle: 'medium'}).format(new Date(value));
  const repeatLabel = value => ({once:'One-off', daily:'Daily', weekdays:'Weekdays', weekly:'Weekly', monthly:'Monthly'})[value] || 'One-off';
  const humanMinutes = minutes => {
    const total = Math.max(0, Math.round(Number(minutes) || 0));
    if (total < 60) return `${total} min`;
    const hours = Math.floor(total / 60);
    const remainder = total % 60;
    return `${hours}h${remainder ? ` ${remainder}m` : ''}`;
  };
  const humanDurationMs = milliseconds => {
    const seconds = Math.max(0, Math.floor(milliseconds / 1000));
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    if (hours) return `${hours}:${pad(minutes)}:${pad(secs)}`;
    return `${minutes}:${pad(secs)}`;
  };

  const storageInfo = {
    available: true,
    message: '',
    repairs: 0,
    loadFailed: false
  };

  const ui = {
    mode: 'current',
    currentReminderId: null,
    drawerType: null,
    recognition: null,
    voiceBase: '',
    timerHandle: null,
    actionLocked: false,
    undoState: null,
    undoTimer: null,
    drawerOpener: null,
    dialogOpener: null,
    pinnedReminderId: null,
    editInitial: '',
    captureDirty: false,
    selectedPreset: 'later',
    dragging: null,
    bannerDismissed: false,
    railPinned: false,
    suppressRailFocusOpen: false
  };

  function defaultState() {
    return {
      version: CONFIG.version,
      reminders: [],
      history: [],
      settings: {
        defaultColor: '#fff18a',
        historyYear: now().getFullYear(),
        notePosition: null
      },
      timer: null,
      updatedAt: now().toISOString()
    };
  }

  function testStorage() {
    try {
      const key = '__postit_storage_test__';
      localStorage.setItem(key, '1');
      localStorage.removeItem(key);
      return true;
    } catch (error) {
      console.warn('Post-it Reminder storage unavailable:', error?.name || 'unknown error');
      storageInfo.available = false;
      storageInfo.message = 'Browser storage is unavailable. You can still use the app, but changes will be lost when this page closes. Try opening the file in Edge or Chrome, or check the browser privacy settings.';
      return false;
    }
  }

  function migrateTimer(rawTimer, reminderIds, repairs) {
    if (!rawTimer || typeof rawTimer !== 'object' || !reminderIds.has(String(rawTimer.reminderId || ''))) return null;
    const startedAt = isValidDate(rawTimer.startedAt) ? new Date(rawTimer.startedAt).toISOString() : null;
    let accumulatedMs = safeNumber(rawTimer.accumulatedMs, 0, 365 * 24 * 60 * 60 * 1000);
    let pausedAt = isValidDate(rawTimer.pausedAt) ? new Date(rawTimer.pausedAt).toISOString() : null;

    if (!('accumulatedMs' in rawTimer) && rawTimer.stoppedMinutes) {
      accumulatedMs = safeNumber(rawTimer.stoppedMinutes, 0, 525600) * 60000;
      pausedAt = isValidDate(rawTimer.stoppedAt) ? new Date(rawTimer.stoppedAt).toISOString() : now().toISOString();
      repairs.push('Migrated an older timer.');
    }

    if (!startedAt && !pausedAt && accumulatedMs === 0) return null;
    return {
      reminderId: String(rawTimer.reminderId),
      startedAt: pausedAt ? null : (startedAt || now().toISOString()),
      accumulatedMs,
      pausedAt,
      firstStartedAt: isValidDate(rawTimer.firstStartedAt) ? new Date(rawTimer.firstStartedAt).toISOString() : (startedAt || null)
    };
  }

  function migrateState(raw) {
    const repairs = [];
    const source = raw && typeof raw === 'object' ? raw : {};
    const migrated = defaultState();
    const rawReminders = Array.isArray(source.reminders) ? source.reminders.slice(0, CONFIG.maxReminders) : [];
    const rawHistory = Array.isArray(source.history) ? source.history.slice(0, CONFIG.maxHistory) : [];
    const ids = new Set();

    migrated.reminders = rawReminders.map((item, index) => {
      const rawReminder = item && typeof item === 'object' ? item : {};
      let id = cleanText(rawReminder.id || uid(), 120);
      if (!id || ids.has(id)) {
        id = uid();
        repairs.push(`Repaired reminder ID ${index + 1}.`);
      }
      ids.add(id);
      const fallbackDate = new Date(Date.now() + 5 * 60000);
      const nextDate = safeDate(rawReminder.nextAt, fallbackDate);
      if (!isValidDate(rawReminder.nextAt)) repairs.push(`Repaired the date for reminder ${index + 1}.`);
      const repeat = CONFIG.repeats.includes(rawReminder.repeat) ? rawReminder.repeat : 'once';
      if (repeat !== rawReminder.repeat && rawReminder.repeat != null) repairs.push(`Repaired the repeat setting for reminder ${index + 1}.`);
      const snoozedUntil = isValidDate(rawReminder.snoozedUntil) ? new Date(rawReminder.snoozedUntil).toISOString() : null;
      const manualDueAt = isValidDate(rawReminder.manualDueAt) ? new Date(rawReminder.manualDueAt).toISOString() : null;
      return {
        id,
        title: cleanText(rawReminder.title, 80),
        text: cleanText(rawReminder.text, 800),
        category: cleanText(rawReminder.category, 40),
        plannedMinutes: safeNumber(rawReminder.plannedMinutes, 0, 1440),
        color: validColour(rawReminder.color || source.settings?.defaultColor),
        repeat,
        nextAt: nextDate.toISOString(),
        anchorDay: safeNumber(rawReminder.anchorDay || nextDate.getDate(), 1, 31),
        snoozedUntil,
        manualDueAt,
        snoozeCount: safeNumber(rawReminder.snoozeCount, 0, 100000),
        active: rawReminder.active !== false,
        paused: Boolean(rawReminder.paused),
        createdAt: isValidDate(rawReminder.createdAt) ? new Date(rawReminder.createdAt).toISOString() : now().toISOString(),
        updatedAt: isValidDate(rawReminder.updatedAt) ? new Date(rawReminder.updatedAt).toISOString() : now().toISOString()
      };
    }).filter(reminder => reminder.text.trim() || reminder.title.trim());

    const reminderIds = new Set(migrated.reminders.map(reminder => reminder.id));
    migrated.history = rawHistory.map((item, index) => {
      const rawItem = item && typeof item === 'object' ? item : {};
      const completedAt = safeDate(rawItem.completedAt, null);
      if (!completedAt) {
        repairs.push(`Removed invalid history item ${index + 1}.`);
        return null;
      }
      return {
        id: cleanText(rawItem.id || uid(), 120),
        reminderId: cleanText(rawItem.reminderId, 120),
        title: cleanText(rawItem.title, 80),
        text: cleanText(rawItem.text, 800),
        category: cleanText(rawItem.category, 40),
        plannedMinutes: safeNumber(rawItem.plannedMinutes, 0, 1440),
        actualMinutes: safeNumber(rawItem.actualMinutes, 0, 1440),
        repeat: CONFIG.repeats.includes(rawItem.repeat) ? rawItem.repeat : 'once',
        scheduledFor: isValidDate(rawItem.scheduledFor) ? new Date(rawItem.scheduledFor).toISOString() : completedAt.toISOString(),
        effectiveDue: isValidDate(rawItem.effectiveDue) ? new Date(rawItem.effectiveDue).toISOString() : completedAt.toISOString(),
        completedAt: completedAt.toISOString(),
        completedEarly: Boolean(rawItem.completedEarly),
        snoozeCount: safeNumber(rawItem.snoozeCount, 0, 100000),
        completionNote: cleanText(rawItem.completionNote, 160),
        timerStartedAt: isValidDate(rawItem.timerStartedAt) ? new Date(rawItem.timerStartedAt).toISOString() : null
      };
    }).filter(Boolean);

    const rawSettings = source.settings && typeof source.settings === 'object' ? source.settings : {};
    const rawPosition = rawSettings.notePosition;
    migrated.settings = {
      defaultColor: validColour(rawSettings.defaultColor),
      historyYear: safeNumber(rawSettings.historyYear || now().getFullYear(), 2000, 2200),
      notePosition: rawPosition && Number.isFinite(Number(rawPosition.left)) && Number.isFinite(Number(rawPosition.top))
        ? {left: Number(rawPosition.left), top: Number(rawPosition.top)}
        : null
    };
    migrated.timer = migrateTimer(source.timer, reminderIds, repairs);
    migrated.version = CONFIG.version;
    migrated.updatedAt = isValidDate(source.updatedAt) ? new Date(source.updatedAt).toISOString() : now().toISOString();
    return {state: migrated, repairs};
  }

  function loadState() {
    testStorage();
    if (!storageInfo.available) return defaultState();
    const stored = localStorage.getItem(CONFIG.storageKey);
    if (!stored) return defaultState();
    try {
      const parsed = JSON.parse(stored);
      const result = migrateState(parsed);
      storageInfo.repairs = result.repairs.length;
      if (result.repairs.length) {
        storageInfo.message = `${result.repairs.length} saved field${result.repairs.length === 1 ? ' was' : 's were'} repaired safely while upgrading to V3.`;
      }
      return result.state;
    } catch (error) {
      console.error('Could not read saved Post-it data:', error);
      storageInfo.loadFailed = true;
      storageInfo.message = 'The saved Post-it data could not be read. The app has opened with an empty temporary state and has not overwritten the unreadable copy. A previous recovery point may still be available in Settings.';
      return defaultState();
    }
  }

  let state = loadState();

  function updateStorageBanner() {
    const banner = $('#storageBanner');
    if (!storageInfo.message || ui.bannerDismissed) {
      banner.classList.add('hidden');
      return;
    }
    $('#storageBannerText').textContent = storageInfo.message;
    banner.classList.remove('hidden');
  }

  function persistState({render = true, preserveUndo = false} = {}) {
    if (!preserveUndo && ui.undoState) hideUndo();
    state.version = CONFIG.version;
    state.updatedAt = now().toISOString();
    if (storageInfo.available) {
      try {
        localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
      } catch (error) {
        console.error('Could not save Post-it data:', error);
        storageInfo.available = false;
        storageInfo.message = error?.name === 'QuotaExceededError'
          ? 'The browser storage space is full. Export a backup now. New changes will remain only until this page closes.'
          : 'The browser blocked saving. New changes will remain only until this page closes.';
        ui.bannerDismissed = false;
        updateStorageBanner();
      }
    }
    if (render) renderAll();
  }

  function readSnapshots() {
    if (!storageInfo.available) return [];
    try {
      const raw = JSON.parse(localStorage.getItem(CONFIG.snapshotKey) || '[]');
      return Array.isArray(raw) ? raw.filter(item => item && item.id && item.state).slice(0, CONFIG.maxSnapshots) : [];
    } catch (error) {
      console.warn('Could not read recovery snapshots:', error?.name || 'unknown error');
      return [];
    }
  }

  function writeSnapshots(snapshots) {
    if (!storageInfo.available) return false;
    let list = snapshots.slice(0, CONFIG.maxSnapshots);
    while (list.length) {
      try {
        localStorage.setItem(CONFIG.snapshotKey, JSON.stringify(list));
        return true;
      } catch (error) {
        if (error?.name !== 'QuotaExceededError') {
          console.warn('Could not save recovery snapshots:', error?.name || 'unknown error');
          return false;
        }
        list.pop();
      }
    }
    return false;
  }

  function saveRecoverySnapshot(snapshotState, reason) {
    if (!storageInfo.available) return;
    const snapshots = readSnapshots();
    const serialised = JSON.stringify(snapshotState);
    if (snapshots[0] && JSON.stringify(snapshots[0].state) === serialised) return;
    snapshots.unshift({
      id: uid(),
      createdAt: now().toISOString(),
      reason: cleanText(reason || 'Recent state', 120),
      state: deepClone(snapshotState)
    });
    writeSnapshots(snapshots);
  }

  function announce(message) {
    $('#liveStatus').textContent = '';
    window.setTimeout(() => { $('#liveStatus').textContent = message; }, 20);
  }

  function toast(message, duration = 2500) {
    const element = $('#toast');
    element.textContent = message;
    element.classList.add('show');
    clearTimeout(element._timer);
    element._timer = setTimeout(() => element.classList.remove('show'), duration);
    announce(message);
  }

  function hideUndo() {
    clearTimeout(ui.undoTimer);
    ui.undoTimer = null;
    ui.undoState = null;
    $('#undoBar').classList.remove('show');
  }

  function showUndo(message, previousState) {
    hideUndo();
    ui.undoState = deepClone(previousState);
    $('#undoText').textContent = message;
    $('#undoBar').classList.add('show');
    ui.undoTimer = setTimeout(hideUndo, CONFIG.undoMs);
  }

  function undoLastAction() {
    if (!ui.undoState) return;
    const current = deepClone(state);
    saveRecoverySnapshot(current, 'Before undo');
    state = migrateState(ui.undoState).state;
    hideUndo();
    persistState();
    toast('Action undone.');
  }

  function runMutation({reason = 'change', undoMessage = '', snapshot = true, animate = false} = {}, mutator) {
    if (ui.actionLocked) return false;
    const previousState = deepClone(state);
    const execute = () => {
      try {
        const changed = mutator();
        if (changed === false) return false;
        if (snapshot) saveRecoverySnapshot(previousState, `Before ${reason}`);
        persistState();
        if (undoMessage) showUndo(undoMessage, previousState);
        return true;
      } catch (error) {
        console.error(`Post-it action failed (${reason}):`, error);
        state = previousState;
        persistState();
        toast('That action could not be completed. Your previous data was restored.');
        return false;
      }
    };

    if (!animate) return execute();
    ui.actionLocked = true;
    $('#postit').classList.add('animate-out');
    window.setTimeout(() => {
      execute();
      $('#postit').classList.remove('animate-out');
      ui.actionLocked = false;
    }, 190);
    return true;
  }

  function effectiveDue(reminder) {
    return safeDate(reminder.snoozedUntil) || safeDate(reminder.manualDueAt) || safeDate(reminder.nextAt, now());
  }

  function isRepeating(reminder) { return reminder.repeat !== 'once'; }
  function isDue(reminder) { return reminder.active !== false && !reminder.paused && effectiveDue(reminder) <= now(); }
  function activeList() { return state.reminders.filter(reminder => reminder.active !== false); }
  function dueList() {
    const rows = state.reminders.filter(isDue).sort((a, b) => effectiveDue(a) - effectiveDue(b));
    if (ui.pinnedReminderId) {
      const index = rows.findIndex(reminder => reminder.id === ui.pinnedReminderId);
      if (index > 0) rows.unshift(rows.splice(index, 1)[0]);
      if (index < 0) ui.pinnedReminderId = null;
    }
    return rows;
  }
  function upcomingList() {
    return state.reminders
      .filter(reminder => reminder.active !== false && !reminder.paused && !isDue(reminder))
      .sort((a, b) => effectiveDue(a) - effectiveDue(b));
  }

  function overdueText(date) {
    const minutes = Math.max(0, Math.round((now() - date) / 60000));
    return minutes > 0 ? `Overdue ${humanMinutes(minutes)}` : 'Due now';
  }

  function dueChip(reminder) {
    const scheduled = new Date(reminder.nextAt);
    const due = effectiveDue(reminder);
    if (reminder.manualDueAt && scheduled > now()) return {text: `Started early · due ${fmtShort(scheduled)}`, className: 'early'};
    if (reminder.snoozedUntil && due > now()) return {text: `Delayed until ${fmtShort(due)}`, className: ''};
    return {text: overdueText(due), className: due < now() ? 'overdue' : ''};
  }

  function addOneOccurrence(date, reminder) {
    const result = new Date(date);
    result.setSeconds(0, 0);
    if (reminder.repeat === 'daily') {
      result.setDate(result.getDate() + 1);
      return result;
    }
    if (reminder.repeat === 'weekdays') {
      do { result.setDate(result.getDate() + 1); } while ([0, 6].includes(result.getDay()));
      return result;
    }
    if (reminder.repeat === 'weekly') {
      result.setDate(result.getDate() + 7);
      return result;
    }
    if (reminder.repeat === 'monthly') {
      const anchorDay = safeNumber(reminder.anchorDay || result.getDate(), 1, 31);
      const year = result.getFullYear();
      const month = result.getMonth() + 1;
      const lastDay = new Date(year, month + 1, 0).getDate();
      return new Date(year, month, Math.min(anchorDay, lastDay), result.getHours(), result.getMinutes(), 0, 0);
    }
    return null;
  }

  function nextOccurrenceAfterCompletion(reminder, completedAt = now()) {
    const scheduled = new Date(reminder.nextAt);
    let candidate = addOneOccurrence(scheduled, reminder);
    if (!candidate) return null;
    if (completedAt < scheduled) return candidate;
    let guard = 0;
    while (candidate <= completedAt && guard < 10000) {
      candidate = addOneOccurrence(candidate, reminder);
      guard += 1;
    }
    if (guard >= 10000) throw new Error('Recurrence calculation exceeded safety limit.');
    return candidate;
  }

  function timerElapsedMs(reminderId) {
    const timer = state.timer;
    if (!timer || timer.reminderId !== reminderId) return 0;
    const accumulated = Math.max(0, Number(timer.accumulatedMs) || 0);
    if (timer.pausedAt || !timer.startedAt) return accumulated;
    return accumulated + Math.max(0, Date.now() - new Date(timer.startedAt).getTime());
  }

  function timerMinutes(reminderId) {
    const milliseconds = timerElapsedMs(reminderId);
    return milliseconds ? Math.max(1, Math.round(milliseconds / 60000)) : 0;
  }

  function stopTimerDisplay() {
    if (ui.timerHandle) clearInterval(ui.timerHandle);
    ui.timerHandle = null;
  }

  function startTimerDisplay() {
    stopTimerDisplay();
    ui.timerHandle = setInterval(() => {
      const element = $('#elapsedTime');
      if (element && ui.currentReminderId) element.textContent = humanDurationMs(timerElapsedMs(ui.currentReminderId));
    }, 1000);
  }

  function toggleTimer(reminderId) {
    const existing = state.timer;
    if (existing && existing.reminderId === reminderId) {
      if (existing.pausedAt || !existing.startedAt) {
        existing.startedAt = now().toISOString();
        existing.firstStartedAt = existing.firstStartedAt || existing.startedAt;
        existing.pausedAt = null;
        persistState();
        toast('Timer resumed.');
      } else {
        existing.accumulatedMs = timerElapsedMs(reminderId);
        existing.startedAt = null;
        existing.pausedAt = now().toISOString();
        persistState();
        toast(`Timer paused at ${humanDurationMs(existing.accumulatedMs)}.`);
      }
      return;
    }

    if (existing && existing.reminderId !== reminderId && !window.confirm('Another Post-it timer is running. Replace it with this timer?')) return;
    state.timer = {reminderId, startedAt: now().toISOString(), firstStartedAt: now().toISOString(), accumulatedMs: 0, pausedAt: null};
    persistState();
    toast('Timer started.');
  }

  function reminderDisplayTitle(reminder) {
    return reminder.title.trim() || reminder.text.trim().split(/\n/)[0].slice(0, 80) || 'Post-it';
  }

  function renderReminderBody(reminder, {upNext = false, waiting = 0} = {}) {
    const hasTitle = Boolean(reminder.title.trim());
    const scheduled = new Date(reminder.nextAt);
    const displayedDate = upNext && reminder.snoozedUntil ? effectiveDue(reminder) : scheduled;
    const timerForThis = state.timer && state.timer.reminderId === reminder.id;
    const timerActive = Boolean(timerForThis && !state.timer.pausedAt && state.timer.startedAt);
    const chip = upNext ? {text: 'All caught up', className: ''} : dueChip(reminder);
    const timerText = timerActive
      ? `${ICONS.pause}<span>Pause timer · <span id="elapsedTime">${esc(humanDurationMs(timerElapsedMs(reminder.id)))}</span></span>`
      : timerForThis
        ? `${ICONS.play}<span>Resume timer · ${esc(humanDurationMs(timerElapsedMs(reminder.id)))}</span>`
        : `${ICONS.play}<span>Start timer</span>`;

    return `
      <div class="note-head">
        <span class="chip ${chip.className}">${esc(chip.text)}</span>
        <button type="button" class="more-btn" id="moreCurrent" aria-label="Edit this Post-it" title="Edit this Post-it">&bull;&bull;&bull;</button>
      </div>
      ${upNext ? '<div class="note-kicker">Up next</div>' : ''}
      ${hasTitle ? `<h1 class="note-title">${esc(reminder.title)}</h1><div class="note-copy">${esc(reminder.text)}</div>` : `<h1 class="note-copy primary-copy">${esc(reminder.text)}</h1>`}
      <div class="note-meta">
        ${reminder.category ? `<span class="meta-pill">${esc(reminder.category)}</span>` : ''}
        <span class="meta-pill">${esc(repeatLabel(reminder.repeat))}</span>
        <span class="meta-pill">${esc(upNext && reminder.snoozedUntil ? `Returns ${fmtShort(displayedDate)}` : fmtShort(displayedDate))}</span>
        ${reminder.plannedMinutes ? `<span class="meta-pill">${reminder.plannedMinutes} min planned</span>` : ''}
      </div>
      ${upNext ? '' : `<div class="micro-row"><button type="button" class="timer-btn ${timerActive ? 'active' : ''}" id="timerBtn">${timerText}</button>${waiting ? `<span class="behind">${waiting} more due</span>` : ''}</div>`}
      <div class="note-actions">
        ${upNext
          ? '<button type="button" class="action ghost" id="startEarlyBtn">START NOW</button><button type="button" class="action primary" id="doneEarlyBtn">DONE EARLY</button>'
          : '<button type="button" class="action" id="delayBtn">DELAY</button><button type="button" class="action primary" id="doneBtn">DONE</button>'}
      </div>`;
  }

  function renderPostit() {
    stopTimerDisplay();
    const captureMode = ui.mode === 'create';
    const wrap = $('#floatWrap');
    const sizeChanged = wrap.classList.contains('capture-mode') !== captureMode;
    wrap.classList.toggle('capture-mode', captureMode);
    if (sizeChanged) window.requestAnimationFrame(placeNote);
    if (captureMode) {
      renderCapture();
      return;
    }

    const note = $('#postit');
    const due = dueList();
    if (due.length) {
      const reminder = due[0];
      ui.currentReminderId = reminder.id;
      note.style.backgroundColor = validColour(reminder.color);
      note.innerHTML = renderReminderBody(reminder, {waiting: due.length - 1});
      $('#moreCurrent').addEventListener('click', event => openEdit(reminder.id, event.currentTarget));
      $('#delayBtn').addEventListener('click', event => openSnooze(reminder.id, event.currentTarget));
      $('#doneBtn').addEventListener('click', event => openDone(reminder.id, event.currentTarget));
      $('#timerBtn').addEventListener('click', () => toggleTimer(reminder.id));
      if (state.timer?.reminderId === reminder.id && !state.timer.pausedAt && state.timer.startedAt) startTimerDisplay();
      return;
    }

    const upcoming = upcomingList()[0];
    if (upcoming) {
      ui.currentReminderId = upcoming.id;
      note.style.backgroundColor = validColour(upcoming.color);
      note.innerHTML = renderReminderBody(upcoming, {upNext: true});
      $('#moreCurrent').addEventListener('click', event => openEdit(upcoming.id, event.currentTarget));
      $('#startEarlyBtn').addEventListener('click', () => startReminderNow(upcoming.id, true));
      $('#doneEarlyBtn').addEventListener('click', event => openDone(upcoming.id, event.currentTarget));
      return;
    }

    ui.currentReminderId = null;
    note.style.backgroundColor = validColour(state.settings.defaultColor);
    note.innerHTML = `
      <div class="note-head"><span class="chip">All caught up</span><button type="button" class="more-btn" id="moreEmpty" aria-label="Open all Post-its" title="Open all Post-its">&bull;&bull;&bull;</button></div>
      <div class="empty-state"><div>
        <div class="empty-mark">${ICONS.check}</div>
        <h1>You're caught up.</h1>
        <p>No upcoming Post-its yet. Add one now, or open the list to review paused reminders.</p>
        <div class="empty-actions"><button type="button" id="clearNew">New Post-it</button><button type="button" id="clearBrowse">All Post-its</button></div>
      </div></div>`;
    $('#moreEmpty').addEventListener('click', event => openDrawer('notes', event.currentTarget));
    $('#clearNew').addEventListener('click', () => startCapture());
    $('#clearBrowse').addEventListener('click', event => openDrawer('notes', event.currentTarget));
  }

  function suggestedLaterToday() {
    const date = new Date(Date.now() + 60 * 60000);
    date.setMinutes(Math.ceil(date.getMinutes() / 15) * 15, 0, 0);
    if (date.getDate() !== now().getDate()) date.setHours(9, 0, 0, 0);
    return date;
  }

  function presetDate(preset) {
    const date = now();
    if (preset === 'later') return suggestedLaterToday();
    if (preset === 'tomorrow') {
      date.setDate(date.getDate() + 1);
      date.setHours(9, 0, 0, 0);
      return date;
    }
    if (preset === 'nextworkday') {
      do { date.setDate(date.getDate() + 1); } while ([0, 6].includes(date.getDay()));
      date.setHours(8, 0, 0, 0);
      return date;
    }
    return suggestedLaterToday();
  }

  function schedulePreviewText(date, repeat) {
    if (!date || Number.isNaN(date.getTime())) return 'Choose a valid date and time.';
    const immediate = date <= now() ? 'This Post-it will appear immediately. ' : '';
    const repeatText = {
      once: 'It will appear once.',
      daily: 'It will then repeat every day.',
      weekdays: 'It will then repeat each weekday.',
      weekly: `It will then repeat every ${new Intl.DateTimeFormat('en-NZ', {weekday:'long'}).format(date)}.`,
      monthly: `It will then repeat monthly on day ${date.getDate()}.`
    }[repeat] || '';
    return `${immediate}Next: ${fmt(date)}. ${repeatText}`;
  }

  function recentCategories() {
    const scores = new Map();
    const add = (category, weight) => {
      const clean = cleanText(category, 40).trim();
      if (clean) scores.set(clean, (scores.get(clean) || 0) + weight);
    };
    state.reminders.forEach(reminder => add(reminder.category, 3));
    state.history.slice(-200).forEach((item, index) => add(item.category, 1 + index / 200));
    return [...scores.entries()].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 12).map(([category]) => category);
  }

  function updateCategorySuggestions() {
    $('#categorySuggestions').innerHTML = recentCategories().map(category => `<option value="${esc(category)}"></option>`).join('');
  }

  function startCapture({voiceReady = false} = {}) {
    closeDrawer();
    stopRecognition();
    ui.mode = 'create';
    ui.selectedPreset = 'later';
    ui.captureDirty = false;
    renderPostit();
    window.setTimeout(() => {
      if (voiceReady) $('#quickMic')?.focus();
      else $('#quickText')?.focus();
    }, 30);
  }

  function captureHasContent() {
    return Boolean($('#quickText')?.value.trim() || $('#quickCategory')?.value.trim() || $('#quickMinutes')?.value);
  }

  function cancelCapture(force = false) {
    if (!force && captureHasContent() && !window.confirm('Discard this unfinished Post-it?')) return;
    stopRecognition();
    ui.mode = 'current';
    ui.captureDirty = false;
    renderPostit();
  }

  function renderCapture() {
    const note = $('#postit');
    note.style.backgroundColor = validColour(state.settings.defaultColor);
    const date = presetDate('later');
    updateCategorySuggestions();
    note.innerHTML = `
      <div class="note-head"><span class="chip">New Post-it</span><button type="button" class="more-btn" id="cancelCapture" aria-label="Cancel new Post-it" title="Cancel">&times;</button></div>
      <h1 class="capture-title">What should I remember?</h1>
      <label class="sr-only" for="quickText">Reminder text</label>
      <textarea class="capture-area" id="quickText" maxlength="800" placeholder="Type your reminder here..." aria-describedby="quickError"></textarea>
      <div class="capture-voice"><button type="button" class="round-btn" id="quickMic" aria-label="Start voice dictation" title="Start voice dictation">${$('#voiceBtn').innerHTML}</button><span class="voice-text" id="voiceStatus">${speechSupported() ? 'Tap the microphone to dictate.' : 'Voice dictation is not available here. Typing still works.'}</span></div>
      <div class="schedule-label">When?</div>
      <div class="preset-grid" role="group" aria-label="Quick schedule choices">
        <button type="button" class="preset-btn selected" data-preset="later">Later today</button>
        <button type="button" class="preset-btn" data-preset="tomorrow">Tomorrow</button>
        <button type="button" class="preset-btn" data-preset="nextworkday">Next workday</button>
        <button type="button" class="preset-btn" data-preset="custom">Choose date</button>
      </div>
      <div class="schedule-row"><input type="date" id="quickDate" value="${localDate(date)}" aria-label="Reminder date"><input type="time" id="quickTime" value="${localTime(date)}" aria-label="Reminder time"><select id="quickRepeat" aria-label="Repeat"><option value="once">One time</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
      <div class="schedule-preview" id="quickSchedulePreview" aria-live="polite"></div>

  function openSnooze(reminderId, opener) {

  }

  function calculateSnooze(value, reminder) {
    const date = now();
    if (value === 'tomorrow') {
      date.setDate(date.getDate() + 1);
      const scheduled = new Date(reminder.nextAt);
      date.setHours(scheduled.getHours(), scheduled.getMinutes(), 0, 0);
      return date;
    }
    if (value === 'nextworkday') {
      do { date.setDate(date.getDate() + 1); } while ([0,6].includes(date.getDay()));
      date.setHours(8,0,0,0);
      return date;
    }
    return new Date(Date.now() + Number(value) * 60000);
  }

  function applySnooze(value) {
    const reminder = state.reminders.find(item => item.id === ui.currentReminderId);
    if (!reminder) return;
    const date = calculateSnooze(value, reminder);
    closeDialog($('#snoozeDialog'));
    runMutation({reason: 'delaying a Post-it', undoMessage: `Post-it delayed until ${fmt(date)}.`, animate: true}, () => {
      reminder.snoozedUntil = date.toISOString();
      reminder.manualDueAt = null;
      reminder.snoozeCount = safeNumber(reminder.snoozeCount + 1, 0, 100000);
      reminder.updatedAt = now().toISOString();
      if (ui.pinnedReminderId === reminder.id) ui.pinnedReminderId = null;
    });
  }

  function applyCustomSnooze() {
    const error = $('#snoozeError');
    error.textContent = '';
    const date = new Date($('#customSnooze').value);
    if (Number.isNaN(date.getTime()) || date <= now()) {
      error.textContent = 'Choose a future date and time.';
      $('#customSnooze').focus();
      return;
    }
    const reminder = state.reminders.find(item => item.id === ui.currentReminderId);

      reminder.manualDueAt = null;

  function openDone(reminderId, opener) {
    const reminder = state.reminders.find(item => item.id === reminderId);
    if (!reminder || ui.actionLocked) return;
    ui.currentReminderId = reminderId;
    const measured = timerMinutes(reminderId);
    if (measured > 0 && measured <= 1440) {
      finishReminder(reminder, measured, '', false);
      return;
    }
    $('#doneName').textContent = reminderDisplayTitle(reminder);
    $('#completionNote').value = '';
    $('#stopRepeat').checked = false;
    $('#stopRepeatRow').classList.toggle('hidden', !isRepeating(reminder));
    $('#doneError').textContent = '';
    const suggested = measured || reminder.plannedMinutes || 15;
    $('#actualMinutes').value = Math.min(suggested, 1440);
    $('#doneTimeHint').textContent = measured > 1440
      ? `The timer is over 24 hours. Enter the actual time to record.`
      : 'Choose the closest time, or enter an exact value.';
    $$('#timeGrid [data-minutes]').forEach(button => {
      const value = Number(button.dataset.minutes);
      button.classList.toggle('selected', Number.isFinite(value) && value === suggested);

  function completeReminder() {
    if (ui.actionLocked) return;
    const reminder = state.reminders.find(item => item.id === ui.currentReminderId);
    if (!reminder) return;
    const rawMinutes = Number($('#actualMinutes').value);
    if (!Number.isFinite(rawMinutes) || rawMinutes < 0 || rawMinutes > 1440 || !Number.isInteger(rawMinutes)) {
      $('#doneError').textContent = 'Enter a whole number from 0 to 1440 minutes.';
      $('#actualMinutes').focus();
      return;
    }
    const completionNote = cleanText($('#completionNote').value, 160).trim();
    const stopRepeating = $('#stopRepeat').checked;
    closeDialog($('#doneDialog'));
    finishReminder(reminder, rawMinutes, completionNote, stopRepeating);
  }

  function finishReminder(reminder, actualMinutes, completionNote = '', stopRepeating = false) {
    if (!reminder || ui.actionLocked) return;
    const completedAt = now();
    const completedEarly = completedAt < new Date(reminder.nextAt);
    const repeatsAgain = isRepeating(reminder) && !stopRepeating;
    const message = repeatsAgain
      ? `Post-it completed in ${humanMinutes(actualMinutes)}. The next occurrence was scheduled.`
      : `Post-it completed in ${humanMinutes(actualMinutes)}.`;
    runMutation({reason: 'completing a Post-it', undoMessage: message, animate: true}, () => {
      state.history.push({
        id: uid(),
        reminderId: reminder.id,
        title: reminder.title,
        text: reminder.text,
        category: reminder.category,
        plannedMinutes: reminder.plannedMinutes,
        actualMinutes,
        repeat: reminder.repeat,
        scheduledFor: reminder.nextAt,
        effectiveDue: effectiveDue(reminder).toISOString(),
        completedAt: completedAt.toISOString(),
        completedEarly,
        snoozeCount: reminder.snoozeCount,
        completionNote,
        timerStartedAt: state.timer?.reminderId === reminder.id ? (state.timer.firstStartedAt || state.timer.startedAt) : null
      });
      if (state.timer?.reminderId === reminder.id) state.timer = null;
      if (repeatsAgain) {
        const next = nextOccurrenceAfterCompletion(reminder, completedAt);
        reminder.nextAt = next.toISOString();
        reminder.anchorDay = reminder.anchorDay || new Date(reminder.nextAt).getDate();
        reminder.snoozedUntil = null;
        reminder.manualDueAt = null;
        reminder.snoozeCount = 0;
        reminder.updatedAt = completedAt.toISOString();
      } else {
        reminder.active = false;
        reminder.snoozedUntil = null;
        reminder.manualDueAt = null;
        reminder.updatedAt = completedAt.toISOString();
      }
      if (ui.pinnedReminderId === reminder.id) ui.pinnedReminderId = null;
    });
  }

  function startReminderNow(reminderId, startTimer = false) {
    const reminder = state.reminders.find(item => item.id === reminderId);
    if (!reminder || reminder.paused || reminder.active === false) return;
    if (startTimer && state.timer && state.timer.reminderId !== reminderId && !window.confirm('Another Post-it timer is running. Replace it with this timer?')) return;
    const previous = deepClone(state);
    reminder.manualDueAt = new Date(Date.now() - 1000).toISOString();
    reminder.snoozedUntil = null;
    reminder.updatedAt = now().toISOString();
    if (startTimer) state.timer = {reminderId, startedAt: now().toISOString(), firstStartedAt: now().toISOString(), accumulatedMs: 0, pausedAt: null};
    saveRecoverySnapshot(previous, 'Before starting a Post-it early');
    closeDrawer();
    persistState();
    toast(startTimer ? 'Post-it started early and timer started.' : 'Post-it brought to the front.');
  }

  function paintCards() {
    const container = $('#drawerCards');
    if (!container) return;
    const query = $('#drawerSearch').value.trim().toLocaleLowerCase('en-NZ');
    const filter = $('#drawerFilter').value;
    let rows = activeList().sort((a,b) => effectiveDue(a) - effectiveDue(b));
    if (query) rows = rows.filter(reminder => `${reminder.title} ${reminder.text} ${reminder.category}`.toLocaleLowerCase('en-NZ').includes(query));
    if (filter === 'due') rows = rows.filter(isDue);
    if (filter === 'upcoming') rows = rows.filter(reminder => !isDue(reminder) && !reminder.paused);
    if (filter === 'repeating') rows = rows.filter(isRepeating);
    if (filter === 'paused') rows = rows.filter(reminder => reminder.paused);
    container.innerHTML = rows.length ? rows.map(cardHtml).join('') : '<div class="panel muted">No matching Post-its.</div>';
    container.onclick = event => {
      const button = event.target.closest('[data-card-action]');
      if (!button) return;
      handleCardAction(button.dataset.cardAction, button.dataset.id, button);
    };
  }

  function handleCardAction(action, reminderId, button) {
    const reminder = state.reminders.find(item => item.id === reminderId);
    if (!reminder) return;
    if (action === 'edit') {
      openEdit(reminderId, button);
      return;
    }
    if (action === 'start') {
      if (isDue(reminder)) {
        ui.pinnedReminderId = reminder.id;
        closeDrawer();
        renderPostit();
        toast('Post-it shown.');
      } else {
        startReminderNow(reminderId, true);
      }
      return;
    }
    if (action === 'pause') {
      const previous = deepClone(state);
      reminder.paused = !reminder.paused;
      reminder.updatedAt = now().toISOString();
      if (reminder.paused && state.timer?.reminderId === reminder.id) state.timer = null;
      saveRecoverySnapshot(previous, `Before ${reminder.paused ? 'pausing' : 'resuming'} a Post-it`);
      persistState();
      toast(reminder.paused ? 'Post-it paused.' : 'Post-it resumed.');
    }
  }

  function historyYearOptions() {
    return [...new Set([now().getFullYear(), ...state.history.map(item => new Date(item.completedAt).getFullYear())])].sort((a,b) => b - a);
  }

  function yearRows(year) {
    return state.history.filter(item => new Date(item.completedAt).getFullYear() === year).sort((a,b) => new Date(a.completedAt) - new Date(b.completedAt));
  }

  function summariseYear(year) {
    const rows = yearRows(year);
    const totalMinutes = rows.reduce((sum, item) => sum + item.actualMinutes, 0);
    const plannedMinutes = rows.reduce((sum, item) => sum + item.plannedMinutes, 0);
    const snoozes = rows.reduce((sum, item) => sum + item.snoozeCount, 0);
    const byCategory = new Map();
    const byMonth = new Map();
    rows.forEach(item => {
      const category = item.category || 'Uncategorised';
      const current = byCategory.get(category) || {count:0, actual:0, planned:0};
      current.count += 1;
      current.actual += item.actualMinutes;
      current.planned += item.plannedMinutes;
      byCategory.set(category, current);
      const month = new Intl.DateTimeFormat('en-NZ', {month:'long'}).format(new Date(item.completedAt));
      byMonth.set(month, (byMonth.get(month) || 0) + item.actualMinutes);
    });
    return {year, rows, totalMinutes, plannedMinutes, snoozes, byCategory, byMonth};
  }

  function paintHistory(year) {
    const summary = summariseYear(Number(year));
    const categories = [...summary.byCategory.entries()].sort((a,b) => b[1].actual - a[1].actual);
    const maxCategory = Math.max(1, ...categories.map(([,value]) => value.actual));
    const newestRows = [...summary.rows].sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));
    $('#historyContent').innerHTML = `
      <div class="stats"><div class="stat"><strong>${(summary.totalMinutes / 60).toFixed(summary.totalMinutes % 60 ? 1 : 0)}</strong><span>actual hours</span></div><div class="stat"><strong>${(summary.plannedMinutes / 60).toFixed(summary.plannedMinutes % 60 ? 1 : 0)}</strong><span>planned hours</span></div><div class="stat"><strong>${summary.rows.length}</strong><span>completed</span></div><div class="stat"><strong>${summary.snoozes}</strong><span>snoozes</span></div></div>

  function restoreSnapshot(snapshotId) {
    const snapshot = readSnapshots().find(item => item.id === snapshotId);
    if (!snapshot || !window.confirm(`Restore the recovery point from ${fmt(snapshot.createdAt)}? Your current state will be saved as another recovery point first.`)) return;
    saveRecoverySnapshot(state, 'Before restoring a recovery point');
    state = migrateState(snapshot.state).state;
    persistState();
    closeDrawer();
    toast('Recovery point restored.');
  }

  function resetAll() {
    if (!window.confirm('Reset all reminders, history and settings? A local recovery point will be kept, but exporting a backup first is safest.')) return;
    if (!window.confirm('This will clear the current app data. Continue?')) return;
    saveRecoverySnapshot(state, 'Before resetting all data');
    state = defaultState();
    persistState();
    closeDrawer();
    centreNote();
    toast('All current data was reset.');
